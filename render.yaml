# Render.com — backend only (TensorFlow needs RAM; use Starter plan or higher)
services:
  - type: web
    name: nrityaai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health
